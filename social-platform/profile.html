<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 - ShareHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">📢 ShareHub</a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">发现</a></li>
        <li><a href="publish.html" class="nav-link nav-publish-btn">✏️ 发布</a></li>
        <li><a href="profile.html" class="nav-link active">👤 我的</a></li>
      </ul>
      <button class="nav-toggle" aria-label="切换菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main class="container profile-page">
    <!-- 个人信息卡片 -->
    <section class="profile-header-card">
      <div class="profile-cover"></div>
      <div class="profile-info">
        <div class="profile-avatar" id="profileAvatar">
          <span class="avatar-emoji">😊</span>
        </div>
        <div class="profile-details">
          <h1 class="profile-name" id="profileName">用户昵称</h1>
          <p class="profile-bio" id="profileBio">这个人很懒，什么都没写...</p>
          <div class="profile-meta">
            <span>📍 北京</span>
            <span>📅 2024年加入</span>
          </div>
          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-value" id="statPosts">0</span>
              <span class="stat-label">动态</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="statLikes">0</span>
              <span class="stat-label">获赞</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="statFollowing">0</span>
              <span class="stat-label">关注</span>
            </div>
          </div>
        </div>
        <button class="btn btn-outline edit-profile-btn" id="editProfileBtn">✏️ 编辑资料</button>
      </div>
    </section>

    <!-- 编辑资料弹窗 -->
    <div class="modal-overlay" id="editProfileModal" style="display:none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3>编辑个人资料</h3>
          <button class="modal-close" id="closeEditModal">&times;</button>
        </div>
        <form class="modal-form" id="editProfileForm">
          <div class="form-group">
            <label for="editName" class="form-label">昵称 <span class="required">*</span></label>
            <input type="text" id="editName" class="form-input" maxlength="20" required>
            <p class="form-error" id="editNameError"></p>
          </div>
          <div class="form-group">
            <label for="editBio" class="form-label">个人简介</label>
            <textarea id="editBio" class="form-textarea" rows="3" maxlength="200"></textarea>
            <span class="char-counter" id="editBioCounter">0 / 200</span>
          </div>
          <div class="form-group">
            <label for="editLocation" class="form-label">所在地</label>
            <input type="text" id="editLocation" class="form-input" maxlength="30">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" id="cancelEditBtn">取消</button>
            <button type="submit" class="btn btn-primary">💾 保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 标签切换 -->
    <section class="profile-tabs">
      <button class="profile-tab active" data-tab="posts">📋 我的动态</button>
      <button class="profile-tab" data-tab="liked">❤️ 赞过的</button>
    </section>

    <!-- 动态列表 -->
    <section class="profile-content" id="profileContent">
      <div class="post-list" id="profilePostList">
        <!-- 由 JS 动态渲染 -->
      </div>
      <div class="empty-state" id="profileEmpty" style="display:none;">
        <span class="empty-icon">📭</span>
        <p>还没有发布过动态</p>
        <a href="publish.html" class="btn btn-primary">去发布第一条</a>
      </div>
    </section>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
</body>
</html>
