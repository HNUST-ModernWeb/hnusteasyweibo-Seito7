<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareHub - 发现精彩</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">📢 ShareHub</a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link active">发现</a></li>
        <li><a href="publish.html" class="nav-link nav-publish-btn">✏️ 发布</a></li>
        <li><a href="profile.html" class="nav-link">👤 我的</a></li>
      </ul>
      <button class="nav-toggle" aria-label="切换菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="container main-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-card quick-post-card">
        <h3>快速分享</h3>
        <p class="quick-post-hint">有什么新鲜事想告诉大家？</p>
        <a href="publish.html" class="btn btn-primary btn-block">✏️ 发布动态</a>
      </div>
      <div class="sidebar-card">
        <h3>热门话题</h3>
        <ul class="topic-list">
          <li class="topic-item"><span class="topic-tag">#技术分享</span><span class="topic-count">128</span></li>
          <li class="topic-item"><span class="topic-tag">#生活日常</span><span class="topic-count">95</span></li>
          <li class="topic-item"><span class="topic-tag">#美食推荐</span><span class="topic-count">67</span></li>
          <li class="topic-item"><span class="topic-tag">#旅行日记</span><span class="topic-count">52</span></li>
        </ul>
      </div>
    </aside>

    <!-- 信息流 -->
    <section class="feed" id="feedContainer">
      <div class="feed-header">
        <h2>📋 最新动态</h2>
        <div class="feed-filter">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="public">公开</button>
          <button class="filter-btn" data-filter="friends">好友可见</button>
        </div>
      </div>
      <div class="post-list" id="postList">
        <!-- 动态由 JS 动态渲染 -->
      </div>
      <div class="load-more-container">
        <button class="btn btn-outline" id="loadMoreBtn">加载更多</button>
      </div>
    </section>
  </main>

  <!-- Toast 提示 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
</body>
</html>
